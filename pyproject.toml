[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/legacy/*.py" = ["E402", "E501", "F401", "F841"]
"notebooks/legacy/*.ipynb" = ["E402", "E501", "F401", "F841"]
"notebooks/archive/**/*.py" = ["E402", "E501", "F401", "F841"]
"notebooks/archive/**/*.ipynb" = ["E402", "E501", "F401", "F841"]
"scripts/legacy/*.py" = ["E402", "E501", "F401", "F841"]

[tool.jupytext]
formats = "ipynb,py:percent"
